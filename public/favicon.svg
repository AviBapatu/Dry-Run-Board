<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <rect width="64" height="64" rx="14" fill="#f4f1ea"/>
  <rect width="64" height="64" rx="14" fill="none" stroke="#2c2c2c" stroke-width="4"/>
  
  <!-- Mini array cells -->
  <rect x="10" y="20" width="20" height="24" rx="2" fill="#eaddc8" stroke="#2c2c2c" stroke-width="2.5"/>
  <rect x="30" y="20" width="24" height="24" rx="2" fill="#f4f1ea" stroke="#2c2c2c" stroke-width="2.5"/>
  
  <!-- Index labels -->
  <text x="20" y="17" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c2c2c" opacity="0.6">0</text>
  <text x="42" y="17" text-anchor="middle" font-family="monospace" font-size="9" fill="#2c2c2c" opacity="0.6">1</text>
  
  <!-- Cell values -->
  <text x="20" y="36" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="#2c2c2c">D</text>
  <text x="42" y="36" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="#2c2c2c">R</text>
  
  <!-- Pencil icon bottom-right -->
  <line x1="40" y1="54" x2="52" y2="42" stroke="#2c2c2c" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="39,56 38,58 40,57" fill="#2c2c2c"/>
  
  <!-- Dot pattern (subtle) -->
  <circle cx="12" cy="52" r="1.2" fill="#dcd7ca"/>
  <circle cx="20" cy="52" r="1.2" fill="#dcd7ca"/>
  <circle cx="28" cy="52" r="1.2" fill="#dcd7ca"/>
  <circle cx="12" cy="46" r="1.2" fill="#dcd7ca"/>
  <circle cx="20" cy="46" r="1.2" fill="#dcd7ca"/>
  <circle cx="28" cy="46" r="1.2" fill="#dcd7ca"/>
</svg>